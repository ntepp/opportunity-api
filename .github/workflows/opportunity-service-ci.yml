name: opportunity-service

on:
  push:
    branches-ignore:
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches-ignore:
      - master

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - uses: actions/checkout@v4

      # Set up JDK 17 for building and testing
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Build the project (skip tests)
      - name: Build (skip tests)
        run: mvn clean install -DskipTests

      # Run tests
      - name: Run tests
        run: mvn test

      # Conditional Docker steps
      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: docker/setup-buildx-action@v3

      - name: Login to Google Container Registry
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v2
        with:
          registry: gcr.io
          username: _json_key
          password: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Build Docker image
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        run: |
          # Extract TAG dynamically based on GitHub reference
          if [[ "$GITHUB_REF" == refs/heads/* ]]; then
            TAG=${GITHUB_REF#refs/heads/}   # Extract branch name
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}    # Extract tag name
          else
            TAG="latest"                    # Default to "latest" if no match
          fi
          
          # Log the resolved TAG
          echo "Resolved TAG: $TAG"
          echo "Setting up GCP_PROJECT_ID as $GCP_PROJECT_ID"
          
          IMAGE_NAME=gcr.io/$GCP_PROJECT_ID/docker-images/opportunity-service
          docker build -t $IMAGE_NAME:$TAG .

          # Push Docker image to GCR
          echo "Push Docker image to GCR"
          docker push $IMAGE_NAME:$TAG