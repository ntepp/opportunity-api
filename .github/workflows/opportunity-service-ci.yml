name: opportunity-service

on:
  push:
    branches-ignore:
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches-ignore:
      - master

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build (skip tests)
        run: mvn clean install -DskipTests

      - name: Run tests
        run: mvn test

  build_and_push_docker:
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Google Container Registry
        uses: docker/login-action@v2
        with:
          registry: gcr.io
          username: _json_key
          password: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
            # Build Docker image

      - name: Build Docker image
        run: |
          # Extract TAG dynamically based on GitHub reference
          if [[ "$GITHUB_REF" == refs/heads/* ]]; then
            TAG=${GITHUB_REF#refs/heads/}   # Extract branch name
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}    # Extract tag name
          else
            TAG="latest"                    # Default to "latest" if no match
          fi
          
          # Log the resolved TAG
          echo "Resolved TAG: $TAG"
          
          IMAGE_NAME=gcr.io/${{ secrets.GCP_PROJECT_ID }}/opportunity-service
          docker build -t $IMAGE_NAME:$TAG .

      # Push Docker image to GCR
      - name: Push Docker image to GCR
        run: |
          IMAGE_NAME=gcr.io/${{ secrets.GCP_PROJECT_ID }}/opportunity-service
          docker push $IMAGE_NAME:$TAG